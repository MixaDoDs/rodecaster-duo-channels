name: ShellCheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax
        run: bash -n rodecaster-duo.sh
      - name: ShellCheck
        run: shellcheck rodecaster-duo.sh
      - name: Help runs
        run: ./rodecaster-duo.sh --help
